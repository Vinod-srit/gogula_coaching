<!DOCTYPE html>
<html>

<head>

    <title>Courses</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial;
        }

        body{
            background:#f4f4f4;
        }

        nav{
            width:100%;
            height:70px;
            background:white;
            display:flex;
            justify-content:space-between;
            align-items:center;
            padding:0 50px;
            box-shadow:0px 2px 10px rgba(0,0,0,0.2);
        }

        .logo{
            font-size:28px;
            font-weight:bold;
            color:blue;
        }

        nav ul{
            display:flex;
            list-style:none;
        }

        nav ul li{
            margin-left:25px;
        }

        nav ul li a{
            text-decoration:none;
            color:black;
            font-size:18px;
            font-weight:bold;
        }

        .heading{
            text-align:center;
            margin-top:30px;
            margin-bottom:30px;
            font-size:45px;
            color:darkblue;
        }

        .course-container{
            width:90%;
            margin:auto;
            display:grid;
            grid-template-columns:repeat(3,1fr);
            gap:25px;
            padding-bottom:40px;
        }

        .course-link{
            text-decoration:none;
            color:black;
            display:block;
        }

        .course-card{
            background:white;
            border-radius:15px;
            overflow:hidden;
            box-shadow:0px 0px 10px rgba(0,0,0,0.2);
            transition:0.3s;
        }

        .course-card:hover{
            transform:scale(1.03);
        }

        .course-card img{
            width:100%;
            height:220px;
            object-fit:cover;
        }

        .course-card h2{
            text-align:center;
            padding:15px;
            color:darkblue;
        }

    </style>

</head>
