<!DOCTYPE html>
<html>

<head>

    <title>Student Registration</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial;
        }

        body{
            background:linear-gradient(to right,#4facfe,#00f2fe);
            min-height:100vh;
        }

        nav{
            width:100%;
            height:70px;
            background:white;
            display:flex;
            justify-content:space-between;
            align-items:center;
            padding:0 50px;
            box-shadow:0px 2px 10px rgba(0,0,0,0.2);
            position:fixed;
            top:0;
            left:0;
        }

        .logo{
            font-size:28px;
            font-weight:bold;
            color:blue;
        }

        nav ul{
            display:flex;
            list-style:none;
        }

        nav ul li{
            margin-left:25px;
        }

        nav ul li a{
            text-decoration:none;
            color:black;
            font-size:18px;
            font-weight:bold;
            transition:0.3s;
        }

        nav ul li a:hover{
            color:blue;
        }

        .main{
            display:flex;
            justify-content:center;
            align-items:center;
            padding-top:120px;
            padding-bottom:40px;
        }

        .container{
            width:450px;
            background:white;
            padding:30px;
            border-radius:15px;
            box-shadow:0px 0px 15px rgba(0,0,0,0.3);
        }

        h1{
            text-align:center;
            margin-bottom:25px;
            color:darkblue;
        }

        .input-group{
            margin-bottom:18px;
        }

        label{
            font-weight:bold;
            display:block;
            margin-bottom:6px;
        }

        input,
        select,
        textarea{
            width:100%;
            padding:12px;
            border:1px solid #ccc;
            border-radius:8px;
            font-size:15px;
        }

        input:focus,
        select:focus,
        textarea:focus{
            outline:none;
            border:2px solid blue;
        }

        textarea{
            resize:none;
            height:80px;
        }

        button{
            width:100%;
            padding:14px;
            background:blue;
            color:white;
            border:none;
            border-radius:8px;
            font-size:18px;
            cursor:pointer;
            transition:0.3s;
        }

        button:hover{
            background:darkblue;
        }

    </style>

</head>

<body>

    <nav>

        <div class="logo">
            GOGULA COACHING
        </div>

        <ul>

            <li><a href="index.html">Home</a></li>
            <li><a href="#">Students</a></li>
            <li><a href="courses.html">Courses</a></li>
            <li><a href="contact.html">Contact</a></li>

        </ul>

    </nav>

    <div class="main">

        <div class="container">

            <h1>Student Registration</h1>

            <form method="post" action="/saveStudent">

                <div class="input-group">
                    <label>First Name</label>
                    <input type="text" name="fname" placeholder="Enter First Name" required>
                </div>

                <div class="input-group">
                    <label>Last Name</label>
                    <input type="text" name="lname" placeholder="Enter Last Name" required>
                </div>

                <div class="input-group">
                    <label>Year Of Passout</label>
                    <input type="number" name="year_of_passout" placeholder="Enter Passout Year" required>
                </div>

                <div class="input-group">
                    <label>Mobile Number</label>
                    <input type="text" name="mobile_number" placeholder="Enter Mobile Number" required>
                </div>

                <div class="input-group">

                    <label>Graduation</label>

                    <select name="graduation">

                        <option>B.Tech</option>
                        <option>B.Sc</option>
                        <option>B.Com</option>
                        <option>MCA</option>
                        <option>M.Tech</option>

                    </select>

                </div>

                <div class="input-group">
                    <label>Address</label>
                    <textarea name="address" placeholder="Enter Address"></textarea>
                </div>

                <div class="input-group">
                    <label>Reference</label>
                    <input type="text" name="reference" placeholder="Enter Reference">
                </div>

                <button type="submit">
                    Register Student
                </button>

            </form>

        </div>

    </div>

</body>

</html>
